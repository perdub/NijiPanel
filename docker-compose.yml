services:
  nijipanel:
    build:
      context: .
      dockerfile: Dockerfile
    image: nijipanel:latest
    container_name: nijipanel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nijipanel_data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_PATH=/data/nijipanel.db
