  <!-- Nijika's Signature Red Ribbon -->
  <g id="ribbon">
    <path
      d="M24 35 C20 32, 14 31, 13 35 C12 39, 18 42, 23 37 Z"
      fill="url(#ribbonGrad)"
      stroke="#9f1239"
      stroke-width="0.8"
    />
    <path
      d="M24 35 C28 32, 34 31, 35 35 C36 39, 30 42, 25 37 Z"
      fill="url(#ribbonGrad)"
      stroke="#9f1239"
      stroke-width="0.8"
    />
    <path d="M22 37 L17 44 L21 42 L23 38 Z" fill="#be123c" />
    <path d="M26 37 L31 44 L27 42 L25 38 Z" fill="#be123c" />
    <ellipse cx="24" cy="36" rx="2.5" ry="2.2" fill="#fda4af" stroke="#9f1239" stroke-width="0.8" />
  </g>

  <!-- Tip Sparkle -->
  <path
    d="M24 2 L25 5 L28 6 L25 7 L24 10 L23 7 L20 6 L23 5 Z"
