<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doritoGrad" x1="24" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="60%" stop-color="#ffd100" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="12" y1="30" x2="28" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="stickGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Crossed Drumsticks -->
  <g opacity="0.9">
    <line x1="8" y1="40" x2="38" y2="10" stroke="url(#stickGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="39" cy="9" r="2.2" fill="#fde68a" />
    <line x1="10" y1="10" x2="40" y2="40" stroke="url(#stickGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="9" cy="9" r="2.2" fill="#fde68a" />
  </g>

  <!-- Dorito Ahoge Chip -->
  <path
    d="M24 6 C25 6, 26 7.5, 27 9 L41 33 C42.2 35, 41.5 37.5, 39.5 38 C38.5 38.3, 10 38.3, 8.5 38 C6.5 37.5, 5.8 35, 7 33 L21 9 C22 7.5, 23 6, 24 6 Z"
    fill="url(#doritoGrad)"
    stroke="#d97706"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Dorito Seasoning specks -->
  <circle cx="23" cy="17" r="0.9" fill="#ea580c" opacity="0.75" />
  <circle cx="28" cy="24" r="0.8" fill="#ea580c" opacity="0.8" />
  <circle cx="18" cy="28" r="1.1" fill="#ea580c" opacity="0.7" />
  <circle cx="32" cy="32" r="0.8" fill="#ea580c" opacity="0.8" />
  <circle cx="24" cy="31" r="0.7" fill="#ea580c" opacity="0.6" />

