name: NijiPanel CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    name: Build Standalone Single-File Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Frontend
        working-directory: src/ServerDeck.Frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Publish Standalone Binary (Linux x64)
        run: |
          dotnet publish src/ServerDeck.Backend/ServerDeck.Backend.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o dist/linux-x64

      - name: Publish Standalone Binary (Windows x64)
        run: |
          dotnet publish src/ServerDeck.Backend/ServerDeck.Backend.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o dist/win-x64

      - name: Publish Standalone Binary (Linux ARM64)
        run: |
          dotnet publish src/ServerDeck.Backend/ServerDeck.Backend.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o dist/linux-arm64

      - name: Package & Archive Binaries
        run: |
          # 1. Linux x64
          mv dist/linux-x64/ServerDeck.Backend dist/linux-x64/nijipanel
          chmod +x dist/linux-x64/nijipanel
          tar -czvf nijipanel-linux-x64.tar.gz -C dist/linux-x64 nijipanel

          # 2. Linux ARM64
          mv dist/linux-arm64/ServerDeck.Backend dist/linux-arm64/nijipanel
          chmod +x dist/linux-arm64/nijipanel
          tar -czvf nijipanel-linux-arm64.tar.gz -C dist/linux-arm64 nijipanel

          # 3. Windows x64 (.exe)
          mv dist/win-x64/ServerDeck.Backend.exe dist/win-x64/nijipanel.exe
          cd dist/win-x64 && zip -9 ../../nijipanel-windows-x64.zip nijipanel.exe && cd ../..

      - name: Upload Binary Artifact (Windows x64)
        uses: actions/upload-artifact@v4
        with:
          name: nijipanel-windows-x64
          path: nijipanel-windows-x64.zip

      - name: Upload Binary Artifact (Linux x64)
        uses: actions/upload-artifact@v4
        with:
          name: nijipanel-linux-x64
          path: nijipanel-linux-x64.tar.gz

      - name: Upload Binary Artifact (Linux ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: nijipanel-linux-arm64
          path: nijipanel-linux-arm64.tar.gz

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nijipanel-windows-x64.zip
            nijipanel-linux-x64.tar.gz
            nijipanel-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
